exp_name: ppo/NEWERA-XI  # dim_key 32->64 (fallback rung a: IX showed shared-space interference, win gap vs VII)
seed: 0
num_iterations: 5.0e+4
log_every: 10
save_every: 100
gamma: 0.998  # b/item-7: longer horizon (~500 steps) for economy/deck-thinning credit
lam: 0.95
coef_value: 0.500
coef_entropy_max: 0.010
coef_entropy_min: 0.001
entropy_decay_steps: 2.0e+7  # env steps (linear decay max -> min, then floor)
max_grad_norm: 0.500
num_envs: 48
rollout_length: 128
clip_eps: 0.20
clip_value_loss: false
minibatch_size: 512
num_epochs: 4
# Rollout(t+1) collected in a side process during update(t), staleness 1. Measured a
# WASH on the 4-P-core M4 post-packing (hidden rollout reappears as update contention:
# 10.5s either way); enable on boxes with spare cores or if rollout grows again.
overlap_rollout: false

model:
  # Core encoder
  dim_entity: 64
  dim_global: 256
  transformer_dim_ff: 128
  transformer_num_heads: 4
  transformer_num_blocks: 2
  gnn_num_layers: 15  # map GNN depth = MAP_HEIGHT → full downstream lookahead per room
  map_encoder_dim: 64

  # Head dimensions
  dim_ff_primary: 64
  dim_ff_value: 64
  dim_key: 64  # pointer key/query dim (AlphaStar full-config size; 32 underperformed = IX)

optimizer:
  name: Adam
  kwargs:
    lr: 1.0e-4
