exp_name: ppo/EFFECT-IIIf
seed: 0
num_iterations: 1.0e+6
gamma: 0.999  # Horizon 1 / (1 - γ) ~= 1000 steps

cadence:
  log_every: 10
  save_every: 100
  eval_every: 100
  archive_every: 1000

# Soft ascension curriculum
curriculum:
  ascension_start: 0.0
  ascension_max: 20
  promote_win_rate: 0.50
  promote_streak: 2
  curriculum_step: 0.25

ppo:
  lam: 0.95 # GAE
  num_epochs: 4
  minibatch_size: 4096
  clip_eps: 0.20
  clip_value_loss: false
  coef_value: 0.500
  coef_entropy: 0.010
  coef_kl_uniform: 0.020
  is_clip: 2.0
  max_grad_norm: 0.500
  target_kl: 0.03

rollout:
  num_envs: 256
  rollout_length: 32
  rollout_workers: 16 # Must divide evenly across `num_envs`

model:
  # Core encoder
  dim_entity: 256
  dim_global: 1024
  transformer_dim_ff: 512
  transformer_num_heads: 4
  transformer_num_blocks: 3  # AlphaStar's depth

  # Map encoder
  gnn_num_layers: 15  # Equals `MAP_HEIGHT`; Full downstream lookahead per room
  map_encoder_dim: 256  # GNN internal width (lifted to `dim_entity` in entity_projector)

  # Head dimensions
  dim_ff_primary: 1024
  dim_ff_value: 1024
  dim_op: 256  # `ActionType`-embedding dim
  dim_key: 256  # Pointer key/query dim

optimizer:
  name: Adam
  kwargs:
    lr: 7.5e-5
    fused: true # One kernel per optimizer step
